- question: 在编程中，字典数据结构的主要存储方式是什么？
  options:
    A: 键值对存储
    B: 数组存储
    C: 链表存储
    D: 栈存储
  answer: A
  explanation: 根据核心定义，字典通过键（Key）来存储和访问对应的值（Value），每个元素都由一个唯一的键和一个关联的值组成，这种存储方式就是键值对存储。
- question: 关于字典中键的特性，以下哪项描述是正确的？
  options:
    A: 每个键必须是唯一的
    B: 键必须是数字类型
    C: 键可以重复，值必须唯一
    D: 键的顺序决定了查找效率
  answer: A
  explanation: 根据关键特征中的'键的唯一性'，字典中的每个键必须是唯一的，不能重复。如果添加重复的键，新值会覆盖旧值。
- question: 字典数据结构的一个主要优势是什么？
  options:
    A: 占用内存极小
    B: 元素自动排序
    C: 通过键访问值非常高效
    D: 只能存储字符串类型数据
  answer: C
  explanation: 根据关键特征中的'高效查找'，通过键访问值通常非常快速，因为字典内部使用哈希表实现，查找时间接近常数时间（O(1)）。
- question: 以下哪个生活例子最能类比字典的工作原理？
  options:
    A: 电话簿
    B: 图书馆书架
    C: 购物清单
    D: 音乐播放列表
  answer: A
  explanation: 根据简单类比部分，电话簿是最贴切的例子：每个人的名字是'键'，对应的电话号码是'值'。通过名字可以快速找到电话号码，这体现了字典通过键访问值的特点。
- question: 在Python中，关于字典的可变性，以下说法正确的是？
  options:
    A: 字典创建后不能修改
    B: 可以随时添加、删除或修改键值对
    C: 只能添加新元素，不能删除
    D: 只能修改值，不能修改键
  answer: B
  explanation: 根据关键特征中的'可变性'，字典是可变的，这意味着创建后可以随时添加、删除或修改键值对，而无需重新创建整个结构。
- question: 在Python中，如何向字典my_dict中添加一个键为'城市'，值为'北京'的元素？
  options:
    A: my_dict.add('城市', '北京')
    B: my_dict.insert('城市', '北京')
    C: my_dict['城市'] = '北京'
    D: 'my_dict.append(''城市'': ''北京'')'
  answer: C
  explanation: 在Python字典中，使用语法dict[key] = value可以直接添加新的键值对，如果键不存在则会创建新的元素。
- question: 以下哪种方法可以正确获取字典my_dict中键'姓名'对应的值？
  options:
    A: name = my_dict['姓名']
    B: name = my_dict('姓名')
    C: name = my_dict.get['姓名']
    D: name = my_dict.姓名
  answer: A
  explanation: 在Python字典中，通过方括号语法dict[key]可以获取指定键对应的值，这是最常用的访问字典元素的方式。
- question: 如何将字典my_dict中键'年龄'的值从25修改为26？
  options:
    A: my_dict.update('年龄', 26)
    B: my_dict['年龄'] = 26
    C: my_dict.set('年龄', 26)
    D: my_dict.modify('年龄', 26)
  answer: B
  explanation: 字典中修改值的语法与添加元素相同，使用dict[key] = new_value，如果键已存在则会更新对应的值。
- question: 在Python中，使用哪个关键字可以删除字典中的指定键值对？
  options:
    A: remove
    B: delete
    C: del
    D: pop
  answer: C
  explanation: del语句用于删除字典中的指定键值对，语法为del dict[key]，这会从字典中移除该键及其对应的值。
- question: 以下哪种方法可以检查字典my_dict中是否存在键'年龄'？
  options:
    A: if my_dict.has_key('年龄')
    B: if '年龄' in my_dict
    C: if my_dict.contains('年龄')
    D: if my_dict.exists('年龄')
  answer: B
  explanation: 在Python中，使用in关键字可以检查字典中是否存在某个键，语法为key in dict，返回布尔值表示是否存在。
- question: 在大多数编程语言中，字典的键通常要求是什么类型？
  options:
    A: 可变类型
    B: 只能是字符串类型
    C: 任意类型
    D: 不可变类型
  answer: D
  explanation: 根据内容，字典的键必须是'不可变'类型，如字符串、数字或元组，因为键需要保持稳定以便哈希表能快速定位值。
- question: 字典和列表在访问元素时的主要区别是什么？
  options:
    A: 列表通过键访问，字典通过索引访问
    B: 两者都通过键访问
    C: 两者都通过索引访问
    D: 列表通过索引访问，字典通过键访问
  answer: D
  explanation: 内容指出，列表通过数字索引（位置）访问元素，而字典通过键访问元素，这是它们的主要区别之一。
- question: 如果向字典中添加一个已存在的键，会发生什么？
  options:
    A: 字典会自动删除该键
    B: 会引发错误
    C: 旧值会保留，新值被忽略
    D: 新值会覆盖旧值
  answer: D
  explanation: '根据内容，字典会自动处理重复键：如果尝试添加一个已存在的键，新值会覆盖旧值，例如在 `dict = {"a": 1, "a": 2}`
    中，键 "a" 的值最终是 2。'
- question: 以下哪种数据类型在Python中不能作为字典的键？
  options:
    A: 字符串
    B: 列表
    C: 整数
    D: 元组
  answer: B
  explanation: 内容说明，在Python中，字典的键必须是不可变类型，例如字符串、数字或元组，但不能用列表作为键，因为列表是可变的。
- question: 如何安全地检查字典中某个键是否存在以避免意外覆盖？
  options:
    A: 直接添加键值对
    B: 使用 `dict.clear()` 方法
    C: 使用 `in` 关键字检查键是否存在
    D: 使用 `dict.keys()` 方法获取所有键
  answer: C
  explanation: 内容提到，为了避免意外覆盖，可以在添加前使用 `in` 关键字检查键是否存在，或者使用 `dict.get(key)` 方法安全地访问值。
