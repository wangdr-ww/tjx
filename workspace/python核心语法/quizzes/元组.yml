- question: 关于元组的核心定义，以下哪项描述最准确？
  options:
    A: 元组是一个无序的、可变的数据集合
    B: 元组是一个无序的、不可变的数据集合
    C: 元组是一个有序的、不可变的数据集合
    D: 元组是一个有序的、可变的数据集合
  answer: C
  explanation: 根据核心定义，元组是一个有序的、不可变的数据集合。有序性意味着元素按定义的顺序存储，不可变性意味着一旦创建就不能改变其内容。
- question: 以下哪项不是元组的关键特征？
  options:
    A: 有序性
    B: 不可变性
    C: 可包含任意类型
    D: 元素类型必须相同
  answer: D
  explanation: 元组的关键特征包括有序性、不可变性、可包含任意类型、轻量高效和常用括号表示。元组可以存储不同类型的数据，因此元素类型不必相同。
- question: 在Python中，通常使用什么符号来定义元组？
  options:
    A: 圆括号 ()
    B: 花括号 {}
    C: 方括号 []
    D: 尖括号 <>
  answer: A
  explanation: 在大多数编程语言（如Python）中，元组常用圆括号 `()` 定义。方括号通常用于列表，花括号用于字典或集合。
- question: 根据元组的简单类比，以下哪个例子最能体现元组的特性？
  options:
    A: 一个可随时添加页面的笔记本
    B: 一个可以重新排列的购物清单
    C: 一张打印后不能更改的电影票座位信息
    D: 一个可以修改内容的便签
  answer: C
  explanation: 电影票上的座位信息（如'第5排，第8座'）是固定的，一旦打印就不能更改，这体现了元组的不可变性和有序性。其他选项都涉及可变性，不符合元组的特性。
- question: 在Python代码示例中，如何访问元组 `person` 中的年龄（第二个元素）？
  options:
    A: person[0]
    B: person[3]
    C: person[2]
    D: person[1]
  answer: D
  explanation: 在Python中，元组的索引从0开始。因此，第一个元素（姓名）使用 `person[0]`，第二个元素（年龄）使用 `person[1]`，第三个元素（城市）使用
    `person[2]`。
- question: 在Python中，关于元组的不可变性，以下描述正确的是？
  options:
    A: 元组创建后可以修改其中的元素
    B: 元组创建后不能修改其中的元素
    C: 元组只能包含数字类型元素
    D: 元组可以转换为列表，但不能转换回来
  answer: B
  explanation: 元组是不可变的数据结构，一旦创建，其中的元素不能被修改。尝试修改元组元素会导致TypeError错误。
- question: 对于元组person = ('张三', 25, '北京')，以下哪个操作可以正确获取第二个元素（年龄）？
  options:
    A: person[0]
    B: person[2]
    C: person[1]
    D: person[3]
  answer: C
  explanation: Python使用从0开始的索引，所以第二个元素的索引是1。person[1]将返回25，即年龄值。
- question: 关于元组的嵌套，以下哪个描述是正确的？
  options:
    A: 元组只能包含基本数据类型，不能嵌套其他元组
    B: 元组可以嵌套其他元组或列表
    C: 嵌套的元组可以被单独修改
    D: 元组最多只能嵌套一层
  answer: B
  explanation: 元组可以包含任何数据类型的元素，包括其他元组或列表，如示例中的nested_tuple = ('数据', (1, 2, 3), [10,
    20])。
- question: 对于元组person = ('张三', 25, '北京')，len(person)的返回值是多少？
  options:
    A: '3'
    B: '2'
    C: '1'
    D: '4'
  answer: A
  explanation: len()函数返回元组中元素的数量。person元组包含3个元素：'张三'、25和'北京'，所以len(person)返回3。
- question: 以下关于元组解包的描述，哪个是正确的？
  options:
    A: 元组解包是将多个变量打包成一个元组
    B: 元组解包只能用于包含两个元素的元组
    C: 元组解包会修改原始元组的内容
    D: 元组解包是将元组的元素分别赋值给多个变量
  answer: D
  explanation: 元组解包是将元组的元素分别赋值给对应的变量，如name, age, city = person，这样name得到'张三'，age得到25，city得到'北京'。
- question: 在Python中，关于元组和列表的主要区别，以下哪项描述是正确的？
  options:
    A: 列表可以修改元素，而元组不能
    B: 元组可以修改元素，而列表不能
    C: 元组和列表都可以修改元素
    D: 元组和列表都不能修改元素
  answer: A
  explanation: 元组是不可变的，创建后不能添加、删除或修改元素；而列表是可变的，支持这些操作。这是两者最核心的区别。
- question: 在Python中，如何正确定义一个只包含一个元素（例如数字1）的元组？
  options:
    A: single_tuple = (1)
    B: single_tuple = (1,)
    C: single_tuple = [1]
    D: single_tuple = 1,
  answer: B
  explanation: 单元素元组必须在元素后加逗号，即写成 (1,)。如果写成 (1)，Python会将其解释为整数1，而不是元组。选项B虽然语法正确，但生成的是元组，而题目要求使用`()`定义。
- question: 以下关于元组不可变性的说法，哪一项是正确的？
  options:
    A: 不可变性是指创建后不能修改元素，但可以访问
    B: 不可变性意味着元组完全不能被访问
    C: 不可变性是指元组不能有多个元素
    D: 不可变性是指元组不能作为函数的返回值
  answer: A
  explanation: 元组的不可变性是指创建后其元素不能被修改、添加或删除，但可以通过索引访问元素，或者进行解包等操作。
- question: 在Python中，以下哪种数据结构可以作为字典的键（key）？
  options:
    A: 列表（List）
    B: 元组（Tuple）
    C: 集合（Set）
    D: 字典（Dictionary）
  answer: B
  explanation: 只有不可变且可哈希的数据类型才能作为字典的键。元组是不可变的，因此可以作为字典的键；而列表、集合和字典本身都是可变的，因此不能作为字典的键。
