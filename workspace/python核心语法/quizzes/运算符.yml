- question: 在编程中，运算符的主要作用是什么？
  options:
    A: 存储数据值
    B: 对变量、值或表达式执行特定操作
    C: 定义变量名称
    D: 创建程序注释
  answer: B
  explanation: 根据核心定义，运算符是编程语言中用于对变量、值或表达式执行特定操作的符号，它告诉计算机'做什么操作'。
- question: 在表达式 `a + b` 中，`a` 和 `b` 被称为什么？
  options:
    A: 运算符
    B: 优先级
    C: 操作数
    D: 结合性
  answer: C
  explanation: 根据关键特征中的操作数要求，每个运算符通常需要一到多个'操作数'（即被操作的数据），在 `a + b` 中，`a` 和 `b` 就是操作数。
- question: 以下哪种类比最适合描述比较运算符的功能？
  options:
    A: 天平
    B: 食谱
    C: 开关组合
    D: 菜刀和锅铲
  answer: A
  explanation: 根据简单类比部分，比较运算符就像天平，例如 `==`（等于）用来判断两盘菜的重量是否相同。
- question: 在复杂表达式中，决定不同运算符执行顺序的是什么？
  options:
    A: 操作数类型
    B: 优先级规则
    C: 运算符颜色
    D: 代码缩进
  answer: B
  explanation: 根据关键特征中的优先级规则，在复杂表达式中，不同运算符的执行顺序由优先级决定（例如，乘除法优先于加减法）。
- question: 逻辑运算符 `and` 在厨房类比中类似于什么？
  options:
    A: 把两种食材混合
    B: 去掉不需要的部分
    C: 判断两盘菜重量是否相同
    D: 两个开关都必须打开灯才亮
  answer: D
  explanation: 根据简单类比部分，逻辑运算符就像开关组合，`and`（与）表示两个开关都必须打开灯才亮。
- question: 运算符的哪个特性决定了当多个相同优先级的运算符出现时的执行方向？
  options:
    A: 结合性
    B: 操作数要求
    C: 类型多样性
    D: 符号形状
  answer: A
  explanation: 根据关键特征中的结合性说明，当多个相同优先级的运算符出现时，结合性决定了它们的执行方向（例如，从左到右或从右到左）。
- question: 在Python中，表达式 `10 == 3` 的结果是什么？
  options:
    A: 'True'
    B: '10'
    C: 'False'
    D: '3'
  answer: C
  explanation: '`==` 是比较运算符，用于判断两个值是否相等。10和3不相等，因此结果为False。'
- question: 逻辑运算符 `and` 在什么情况下返回True？
  options:
    A: 两个条件都为真
    B: 两个条件都为假
    C: 任意一个条件为真
    D: 第一个条件为真
  answer: A
  explanation: 逻辑运算符 `and` 要求其连接的两个条件都为真时，整个表达式才为真。
- question: 在表达式 `(num1 > 5) and (num2 < 5)` 中，如果num1=10, num2=3，结果是什么？
  options:
    A: 'False'
    B: '3'
    C: '10'
    D: 'True'
  answer: D
  explanation: '`num1 > 5` 即10>5为True，`num2 < 5` 即3<5为True。True and True 的结果是True。'
- question: 表达式 `(num1 < 5) or (num2 > 5)` 在num1=10, num2=3时的结果是？
  options:
    A: 'True'
    B: '3'
    C: '10'
    D: 'False'
  answer: D
  explanation: '`num1 < 5` 即10<5为False，`num2 > 5` 即3>5为False。False or False 的结果是False。'
- question: 运算符和函数的主要区别是什么？
  options:
    A: 运算符更灵活，函数更高效
    B: 运算符是符号，函数是命名的代码块
    C: 函数只能处理数字，运算符可以处理所有类型
    D: 运算符必须用括号调用，函数不需要
  answer: B
  explanation: 运算符是符号（如+、==），直接对操作数进行简单操作；函数是命名的代码块（如print()），通过调用执行更复杂的任务。
- question: 关于运算符优先级，以下哪项描述是正确的？
  options:
    A: 所有运算符优先级相同
    B: 加法总是比乘法先执行
    C: 优先级定义了表达式中运算符的执行顺序
    D: Python中没有运算符优先级规则
  answer: C
  explanation: 运算符优先级定义了表达式中运算符的执行顺序，类似于数学中的'先乘除后加减'。在`2 + 3 * 4`中，乘法先执行，结果是14。
