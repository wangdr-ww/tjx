- question: 递归的核心定义是什么？
  options:
    A: 一种仅用于数学计算的技术
    B: 一个函数在执行过程中调用其他函数
    C: 使用循环结构重复执行代码
    D: 一个函数在执行过程中直接或间接地调用自身
  answer: D
  explanation: 根据核心定义部分，递归指的是一个函数在执行过程中直接或间接地调用自身，通过分解问题为更小的相同类型子问题来求解。
- question: 在递归中，什么条件必须存在以避免无限循环？
  options:
    A: 递归情况
    B: 自调用
    C: 栈结构
    D: 基本情况
  answer: D
  explanation: 关键特征部分指出，递归必须有一个或多个明确的终止条件（即基本情况），当满足这些条件时函数不再调用自身，从而避免无限递归。
- question: 递归函数依赖于计算机的什么结构来保存每次函数调用的状态？
  options:
    A: 队列
    B: 栈结构
    C: 链表
    D: 数组
  answer: B
  explanation: 在关键特征中，栈结构被描述为递归调用的依赖，每次递归调用都会在调用栈上添加一个新帧，直到基本情况返回后依次弹出。
- question: 以下哪个生活类比最适合解释递归的分解和终止过程？
  options:
    A: 煮饭过程
    B: 写日记
    C: 开车旅行
    D: 俄罗斯套娃
  answer: D
  explanation: 简单类比部分使用俄罗斯套娃作为例子，其中一层层打开娃娃直到最小的那个（基本情况），然后逐层合上（返回结果），体现了递归的自我重复和终止。
- question: 在递归函数中，当问题规模减小时，函数会进入什么状态？
  options:
    A: 递归情况
    B: 基本情况
    C: 终止状态
    D: 初始状态
  answer: A
  explanation: 关键特征定义了递归情况：在非基本情况下，函数通过调用自身逐步分解问题，每次调用使问题规模变小，最终导向基本情况。
- question: 递归适用于哪种类型的问题？
  options:
    A: 仅限数学计算问题
    B: 可以划分为相似子问题的问题
    C: 所有编程问题
    D: 仅限数据结构遍历
  answer: B
  explanation: 关键特征中提到，递归适用于可以划分为相似子问题的问题，例如阶乘、斐波那契数列或树和图的遍历，这体现了其通用性。
- question: 在计算阶乘的递归函数中，如果缺少基本情况会发生什么？
  options:
    A: 函数会返回一个随机值
    B: 函数会返回0
    C: 函数会进入无限递归，导致栈溢出
    D: 函数会跳过递归调用
  answer: C
  explanation: 基本情况是递归的终止条件。如果缺少基本情况，递归函数会无限调用自身，每次调用都会在调用栈上添加栈帧，最终耗尽栈空间导致栈溢出错误。
- question: 递归和循环（迭代）的主要区别是什么？
  options:
    A: 递归只能用于数学计算，循环用于所有场景
    B: 递归总是比循环更高效
    C: 递归通过函数调用自身实现，循环使用for或while等结构
    D: 循环不能处理树结构，递归可以
  answer: C
  explanation: 递归通过函数调用自身来分解问题，而循环使用迭代结构重复执行代码块。递归代码通常更简洁，但可能效率较低；循环更高效，但代码可能更复杂。
- question: 以下哪种情况最适合使用递归而不是循环？
  options:
    A: 需要高性能的大规模数据处理
    B: 问题可以自然分解为相似的子问题，如树遍历
    C: 避免函数调用开销
    D: 栈空间有限的环境
  answer: B
  explanation: 递归适合处理自然递归的问题，如树结构遍历或分治算法，因为这些问题的定义本身就包含子问题。其他选项更倾向于使用循环以避免递归的缺点。
- question: 递归在现实编程中的一个典型应用是什么？
  options:
    A: 文件系统遍历，扫描文件夹和子文件夹
    B: 简单的计数器递增
    C: 基本算术运算
    D: 单层数组排序
  answer: A
  explanation: 递归常用于文件系统遍历，因为文件夹可能包含子文件夹，这自然形成递归结构。其他选项通常可以用简单循环更高效地实现。
- question: 如何避免递归导致的栈溢出错误？
  options:
    A: 使用更多的全局变量
    B: 增加递归深度限制
    C: 确保定义明确的基本情况
    D: 避免任何函数调用
  answer: C
  explanation: 避免栈溢出的关键方法是确保递归有正确的基本情况作为终止点。其他选项如增加递归深度可能缓解但不能根本解决问题，而使用全局变量或避免函数调用不相关。
- question: 在计算5的阶乘的递归调用链中，最终结果如何形成？
  options:
    A: 通过多次函数调用，逐步相乘直到基本情况
    B: 直接返回5的阶乘值，无需计算
    C: 使用循环替代递归计算
    D: 只计算一次并缓存结果
  answer: A
  explanation: 递归调用链从factorial(5)开始，逐步调用factorial(4)、factorial(3)等，直到基本情况factorial(1)返回1，然后反向相乘得到5*4*3*2*1=120。
