- question: 匿名函数最核心的定义特征是什么？
  options:
    A: 具有复杂的逻辑结构
    B: 必须存储在变量中
    C: 只能用于数学运算
    D: 没有具体的函数名称
  answer: D
  explanation: 根据文档的'核心定义'部分，匿名函数是一种'没有名称的函数'，这是其最本质的特征，使其区别于需要通过名称声明的普通函数。
- question: 以下哪一项是匿名函数的主要应用场景？
  options:
    A: 定义复杂的类和方法
    B: 作为参数传递给其他函数
    C: 作为程序的主入口函数
    D: 用于声明全局配置常量
  answer: B
  explanation: 文档在'关键特征'中明确指出，匿名函数'可作为参数传递'，并且'常用于一次性场景，例如作为回调函数或在高阶函数中使用'。
- question: 关于匿名函数的'简洁性'，以下描述最准确的是？
  options:
    A: 它必须包含至少三个参数
    B: 它能够自动处理所有异常
    C: 它比普通函数的运行速度更快
    D: 它通常用一行或少量代码表示简单逻辑
  answer: D
  explanation: 在'关键特征'的'简洁性'中，文档说明匿名函数'通常用一行或少量代码表示，专注于简单的逻辑'，这使其代码更易读和编写。
- question: 文档中'临时工'的类比是为了说明匿名函数的哪个特性？
  options:
    A: 高薪
    B: 永久性
    C: 无需名称的临时性
    D: 管理团队
  answer: C
  explanation: 在'简单类比'部分，'临时工'的例子旨在说明匿名函数像临时工一样，'执行一个特定工作，但你不关心它的身份（名称）'，强调了其'没有名称'和'临时性'的特点。
- question: 在Python中，用于定义匿名函数的关键字是什么？
  options:
    A: lambda
    B: func
    C: def
    D: anonymous
  answer: A
  explanation: 在'代码示例'的开头部分，文档明确指出：'Python中的匿名函数通过lambda关键字定义'。而'def'是用来定义普通命名函数的关键字。
- question: '在Python中，`sorted(numbers, key=lambda x: x * x)` 这行代码的作用是什么？'
  options:
    A: 对列表numbers中的元素进行平方运算
    B: 将列表numbers中的每个元素替换为其平方值
    C: 根据元素的平方值对原列表进行排序，输出原元素
    D: 过滤出列表numbers中的平方数
  answer: C
  explanation: 'sorted函数的key参数指定一个函数（这里是lambda x: x*x），该函数应用于每个元素以生成排序依据的键。排序是基于这些键（平方值）进行的，但输出的仍然是原始列表中的元素。'
- question: '对于列表 `numbers = [4, 1, 3, 2]`，执行 `sorted(numbers, key=lambda x: x * x)`
    后，输出的第一个元素是什么？'
  options:
    A: '4'
    B: '1'
    C: '16'
    D: '2'
  answer: B
  explanation: 各元素的平方值分别为 [16, 1, 9, 4]。按平方值排序后为 [1, 4, 9, 16]，这些平方值对应的原列表元素依次是 [1,
    2, 3, 4]。因此，排序后列表的第一个元素是1。
- question: '`map(lambda x: x * 2, numbers)` 这行代码返回的是什么类型？'
  options:
    A: 一个列表
    B: 一个迭代器
    C: 一个元组
    D: 一个生成器表达式
  answer: B
  explanation: 在Python中，map函数返回的是一个map对象，它是一个迭代器。如果需要列表，通常会用list()函数进行转换，如示例中的 `list(map(...))`。
- question: '假设 `numbers = [1, 2, 3]`，执行 `list(map(lambda x: x * 2, numbers))` 的结果是什么？'
  options:
    A: '[2, 4, 6]'
    B: '[1, 4, 9]'
    C: '[1, 2, 3]'
    D: '[3, 6, 9]'
  answer: A
  explanation: '匿名函数 `lambda x: x * 2` 将每个输入元素乘以2。因此，列表 [1, 2, 3] 中的每个元素经过该函数处理后会变为
    [2, 4, 6]。'
- question: '在 `sorted(numbers, key=lambda x: x * x)` 中，匿名函数 `lambda x: x * x` 的主要作用是什么？'
  options:
    A: 修改列表numbers中的元素值
    B: 生成排序后新列表的元素
    C: 过滤掉列表中的非数字元素
    D: 作为排序时比较元素大小的直接依据
  answer: D
  explanation: key参数指定的函数（匿名函数）用于从每个列表元素中提取一个用于比较的键（key）。在这里，它计算每个元素的平方值，sorted函数则根据这些平方值的大小来决定原元素的顺序。
- question: 根据内容，匿名函数最适合在什么情况下使用？
  options:
    A: 当函数逻辑复杂且需要多次调用时
    B: 当函数需要命名以便重复使用时
    C: 当函数逻辑简单且只使用一次时
    D: 当函数需要处理大量数据时
  answer: C
  explanation: 内容明确指出，匿名函数通常用于一次性、简单的任务，例如作为参数传递给map或filter函数，如果逻辑复杂或需要多次调用，建议使用普通函数。
- question: 在Python中，匿名函数的语法是什么？
  options:
    A: 'def 参数: 表达式'
    B: function(参数) { 表达式 }
    C: 'lambda 参数: 表达式'
    D: '匿名函数 参数: 表达式'
  answer: C
  explanation: '内容中说明，匿名函数在Python中用lambda定义，语法为lambda 参数: 表达式，它自动返回表达式的结果。'
- question: 关于匿名函数和普通函数的区别，以下哪项是正确的？
  options:
    A: 匿名函数有名称，普通函数没有名称
    B: 匿名函数没有名称，通常用于简单任务；普通函数有名称，可重复调用
    C: 匿名函数适合复杂逻辑，普通函数适合简单任务
    D: 匿名函数在所有语言中语法相同
  answer: B
  explanation: 内容中解答了匿名函数和普通函数的区别：匿名函数没有名称，用于简单、一次性任务；普通函数有名称，可重复调用，适合复杂逻辑。
- question: 在什么情况下不建议使用匿名函数？
  options:
    A: 当函数逻辑复杂或需要多次调用时
    B: 当作为参数传递给map函数时
    C: 当函数逻辑简单且只使用一次时
    D: 当想保持代码简洁时
  answer: A
  explanation: 内容建议，如果函数逻辑复杂或需要多次调用，使用普通函数会更清晰和高效，因此在这种情况下不建议使用匿名函数。
- question: 关于匿名函数在不同编程语言中的实现，以下哪项是正确的？
  options:
    A: 匿名函数在Java中通过函数式接口实现，概念相似但语法可能不同
    B: Python中的匿名函数称为箭头函数
    C: 所有语言的匿名函数语法和名称都相同
    D: JavaScript中的匿名函数只能用def定义
  answer: A
  explanation: 内容指出，不同语言的匿名函数实现可能不同，例如在Python中称为lambda函数，在JavaScript中可以是箭头函数，在Java中通过函数式接口实现，但核心概念相似。
