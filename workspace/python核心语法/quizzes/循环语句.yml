- question: 循环语句的核心功能是什么？
  options:
    A: 让一段代码被重复执行多次
    B: 提高程序的运行速度
    C: 增加代码的复杂度
    D: 定义新的变量
  answer: A
  explanation: 根据核心定义，循环语句允许一段代码被重复执行多次，直到某个条件不再满足，其核心功能就是实现代码的重复执行。
- question: 在循环语句中，控制循环启动、继续或终止的关键因素是什么？
  options:
    A: 循环变量的数据类型
    B: 条件表达式
    C: 代码的缩进格式
    D: 循环语句的命名
  answer: B
  explanation: 根据关键特征中的'条件控制'，循环的启动、继续或终止都依赖于一个条件表达式。只有当条件为真时循环才会执行，条件变为假时循环停止。
- question: 在'洗碗'的类比中，哪种循环类型最符合其特点？
  options:
    A: while循环
    B: for循环
    C: do-while循环
    D: 无限循环
  answer: B
  explanation: 在简单类比中，'洗碗'的例子被比作for循环，因为你知道总共有多少个盘子（迭代次数已知），然后重复执行'擦洗'动作。
- question: 在编程中，如果循环条件永远为真，会导致什么结果？
  options:
    A: 程序编译错误
    B: 循环执行一次后停止
    C: 循环变量自动重置
    D: 无限循环
  answer: D
  explanation: 根据关键特征中的'避免无限循环'，如果循环条件永远为真，会导致无限循环，这可能使程序卡死，因此设计循环时需要确保条件最终能变为假。
- question: 在for循环中，常用于跟踪当前执行状态的变量被称为什么？
  options:
    A: 条件变量
    B: 迭代变量
    C: 控制变量
    D: 循环变量
  answer: D
  explanation: 根据关键特征中的'循环变量'，在循环中，常常使用一个变量（称为循环变量）来跟踪当前执行的状态。例如，在for循环中，这个变量会随着每次迭代自动更新。
- question: 在while循环中，以下哪个操作对于避免无限循环至关重要？
  options:
    A: 在循环体内打印变量值
    B: 在循环体内修改条件判断中使用的变量
    C: 在循环开始前初始化计数器
    D: 使用break语句提前退出循环
  answer: B
  explanation: 在while循环中，必须在循环体内修改条件判断中使用的变量（如示例中的count += 1），否则条件永远为真会导致无限循环。
- question: "观察以下代码片段，输出结果是什么？\nfor i in range(1, 6):\n    print(i)"
  options:
    A: 1 2 3 4 5（同一行）
    B: 0 1 2 3 4（每个数字占一行）
    C: 1 2 3 4 5（每个数字占一行）
    D: 1 2 3 4 5 6（每个数字占一行）
  answer: C
  explanation: range(1, 6)生成从1到5的整数序列，每次迭代打印一个数字，由于print()默认换行，所以每个数字单独占一行。
- question: 在循环结构中，break语句的主要作用是什么？
  options:
    A: 跳过当前迭代的剩余代码，直接进入下一次迭代
    B: 暂停循环一段时间后再继续
    C: 立即终止整个循环的执行
    D: 重新开始当前迭代
  answer: C
  explanation: break语句用于立即终止当前循环，即使循环条件仍然为真也会完全退出循环。
- question: 以下哪个while循环会打印数字1到5，每个数字占一行？
  options:
    A: "count = 1\nwhile count <= 5:\n    print(count)\n    count += 1"
    B: "count = 0\nwhile count <= 5:\n    print(count)\n    count += 1"
    C: "count = 1\nwhile count < 5:\n    print(count)\n    count += 1"
    D: "count = 1\nwhile count <= 5:\n    count += 1\n    print(count)"
  answer: A
  explanation: 选项C正确初始化count为1，条件count <= 5确保包含5，且先打印后自增，能正确输出1到5。
- question: 在循环中，continue语句的作用是？
  options:
    A: 立即退出整个程序
    B: 暂停循环直到用户输入
    C: 终止当前循环并返回一个值
    D: 跳过当前迭代的剩余代码，直接进入下一次循环迭代
  answer: D
  explanation: continue语句会跳过当前迭代中剩余的代码，直接开始下一次循环迭代，而不退出整个循环。
- question: 在Python循环中，当执行到`continue`语句时，会发生什么？
  options:
    A: 暂停循环5秒钟
    B: 立即退出整个循环
    C: 跳过当前迭代的剩余代码，进入下一次迭代
    D: 重新开始当前迭代
  answer: C
  explanation: '`continue`语句用于跳过当前循环迭代中剩余的代码，直接进入下一次迭代，不会退出整个循环。'
- question: 以下关于`break`语句的描述，哪一项是正确的？
  options:
    A: '`break`语句会立即退出整个循环'
    B: '`break`语句会暂停循环一段时间'
    C: '`break`语句用于跳过当前迭代并继续下一次迭代'
    D: '`break`语句用于重新启动循环'
  answer: A
  explanation: '`break`语句的作用是立即终止并退出当前循环，无论循环条件是否仍然满足。'
- question: 在给定的代码示例中，当循环变量`num`等于8时，输出结果是什么？
  options:
    A: 立即退出循环，不再打印8及之后的数字
    B: 跳过数字8，继续打印后续数字
    C: 打印数字8，然后继续循环
    D: 重新从数字1开始循环
  answer: A
  explanation: 根据代码，当`num == 8`时执行`break`语句，这会立即退出循环，因此数字8不会被打印，且之后的数字9和10也不会被处理。
