- question: 在编程中，'作用域'主要定义了以下哪项内容？
  options:
    A: 变量的数据类型和存储方式
    B: 变量、函数等标识符在代码中可以被访问和使用的范围
    C: 程序的执行速度和性能优化
    D: 代码的注释和文档编写规范
  answer: B
  explanation: 根据核心定义，作用域定义了变量、函数或其他标识符在代码中可以被访问和使用的范围，决定了变量在哪里'有效'，在哪里'无效'。
- question: 以下哪种作用域的特点是变量在整个程序的任何地方都可以被访问？
  options:
    A: 全局作用域
    B: 块级作用域
    C: 局部作用域
    D: 动态作用域
  answer: A
  explanation: 根据关键特征，全局作用域是指变量在代码顶层定义，可以在整个程序的任何地方被访问。虽然方便，但过度使用可能导致代码难以维护。
- question: 当代码中嵌套多个作用域时，程序查找变量的顺序通常是怎样的？
  options:
    A: 从内到外顺序查找
    B: 随机顺序查找
    C: 从外到内顺序查找
    D: 只查找当前作用域
  answer: A
  explanation: 根据作用域链的描述，当代码中嵌套多个作用域时，程序会按照从内到外的顺序查找变量。如果在当前作用域找不到变量，它会向上级作用域继续查找，直到全局作用域。
- question: 在JavaScript中，使用let关键字在if语句的{}内定义的变量具有什么作用域？
  options:
    A: 全局作用域
    B: 块级作用域
    C: 动态作用域
    D: 函数作用域
  answer: B
  explanation: 根据块级作用域的描述，在现代编程语言如JavaScript中，使用let和const定义的变量可以在一个代码块（如{}内的if语句或循环）中定义，并且只在该块内有效，这就是块级作用域。
- question: 在JavaScript中，以下关于变量作用域的说法哪个是正确的？
  options:
    A: 使用var声明的变量具有块级作用域
    B: 使用let声明的变量具有函数作用域
    C: 使用const声明的变量具有块级作用域
    D: 所有变量类型都具有相同的作用域规则
  answer: C
  explanation: const和let都具有块级作用域，只在定义的代码块内有效。var具有函数作用域，在函数内部可访问，而let和const的作用域规则更严格，有助于避免意外错误。
- question: "以下代码执行后，控制台会输出什么？\n```javascript\nif (true) {\n  let blockVar = '块内变量';\n\
    \  console.log(blockVar);\n}\nconsole.log(blockVar);\n```"
  options:
    A: 先输出'块内变量'，然后再次输出'块内变量'
    B: 输出两次undefined
    C: 直接报错，没有任何输出
    D: 先输出'块内变量'，然后报错
  answer: D
  explanation: 在if块内使用let定义的blockVar具有块级作用域，在块内可正常访问输出'块内变量'。但在块外访问时，由于块级作用域的限制，blockVar未定义，会导致引用错误。
- question: 关于全局变量和局部变量的使用，以下哪个说法最符合最佳实践？
  options:
    A: 应该优先使用全局变量，因为访问更方便
    B: 全局变量和局部变量没有区别，可以随意使用
    C: 应该优先使用局部变量，以减少命名冲突和便于维护
    D: 所有变量都应该声明为const常量
  answer: C
  explanation: 全局变量虽然在整个程序中可访问，但容易导致命名冲突和调试困难。推荐优先使用局部变量，保持代码的模块化和安全性，这是编程中的最佳实践。
