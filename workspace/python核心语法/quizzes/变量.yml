- question: 在编程中，变量最贴切的比喻是什么？
  options:
    A: 一个带标签的盒子，可以存放和更换物品
    B: 一个固定的数值，在程序运行中不会改变
    C: 一段执行特定任务的代码
    D: 一个数学公式，用于计算结果
  answer: A
  explanation: 根据内容中的核心定义，变量被描述为'带标签的盒子'，盒子里可以放各种东西（数据），并且内容可以随时更换，这准确地反映了变量的本质。
- question: 变量的哪个特性允许我们在程序运行过程中修改其存储的值？
  options:
    A: 名称（标识符）
    B: 类型
    C: 作用域
    D: 可变性
  answer: D
  explanation: 内容中明确提到'可变性'是变量的关键特征之一，它表示变量的值可以在程序运行过程中被修改，例如从 `age = 18` 改为 `age
    = 19`。
- question: 在Python代码 `name = '小明'` 中，`'小明'` 代表变量的什么？
  options:
    A: 值
    B: 名称
    C: 类型
    D: 作用域
  answer: A
  explanation: 根据关键特征部分，'值'是变量中存储的具体数据。在给定的代码中，字符串 `'小明'` 就是存储在变量 `name` 中的具体数据，即变量的值。
- question: 根据储物柜类比，储物柜的编号对应变量的哪个方面？
  options:
    A: 变量的值
    B: 变量的类型
    C: 变量的可变性
    D: 变量的名称
  answer: D
  explanation: 在简单类比部分，储物柜类比明确指出：'储物柜的编号就是变量名'。因此，储物柜的编号对应的是变量的名称（标识符）。
- question: 以下关于变量名称（标识符）的描述，哪一项是正确的？
  options:
    A: 它决定了变量在代码中的可见范围
    B: 它存储了变量的具体数据内容
    C: 它用于在代码中唯一地识别该变量
    D: 它定义了变量可以存储的数据种类
  answer: C
  explanation: 在关键特征部分，对'名称（标识符）'的描述是：'每个变量都有一个唯一的名字，用于在代码中识别它'。因此，它的主要作用是唯一地识别变量。
- question: 在便签贴类比中，当喝掉一瓶牛奶后将便签上的数字从2改为1，这个操作主要演示了变量的哪个概念？
  options:
    A: 变量的名称是固定的
    B: 变量的值可以被改变
    C: 变量必须先声明类型
    D: 变量的作用域是全局的
  answer: B
  explanation: 便签贴类比中明确说明：'当喝掉一瓶牛奶后，你可以把便签上的数字改成 1 → 这展示了值的改变'。这直接对应了变量'可变性'的特征，即变量的值可以被修改。
- question: 根据代码 `age = 19` 和 `birth_year = 2024 - age`，birth_year 的值是多少？
  options:
    A: '2005'
    B: '2004'
    C: '2006'
    D: '2003'
  answer: A
  explanation: 因为 age 的值是 19，所以 2024 - 19 = 2005，因此 birth_year 的值为 2005。
- question: 以下哪个变量名是合法的？
  options:
    A: 1age
    B: for
    C: _name
    D: my variable
  answer: C
  explanation: 变量名不能以数字开头（如 1age），不能使用关键字（如 for），不能包含空格（如 my variable）。以字母或下划线开头（如
    _name）是合法的。
- question: 在 Python 中，一个变量是否可以存储不同类型的数据？
  options:
    A: 永远不可以
    B: 可以，因为 Python 是动态类型语言
    C: 不可以，除非重新启动程序
    D: 只有在定义时指定类型才可以
  answer: B
  explanation: 在 Python 等动态类型语言中，变量可以存储不同类型的数据，例如先存储数字，后存储文本。
- question: 变量的生命周期通常是怎样的？
  options:
    A: 永久存储在计算机中
    B: 只在定义它的代码行执行时存在
    C: 只在程序运行期间存在
    D: 即使关闭程序也不会消失
  answer: C
  explanation: 变量通常在程序运行期间存在，关闭程序后变量就会消失。
- question: 代码 `print('新年龄:', age)` 输出什么，如果 age 的值是 19？
  options:
    A: '新年龄: age'
    B: '新年龄: 19'
    C: '新年龄: 18'
    D: '新年龄: 20'
  answer: B
  explanation: 'print 函数会输出字符串 ''新年龄:'' 和变量 age 的值 19，因此输出为 ''新年龄: 19''。'
